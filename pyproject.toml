[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdo-music-composer"
dynamic = ["version"]
description = "Unofficial desktop music editor and Black Desert score workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "bdo_music_composer.app.application_metadata.APP_VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "bdo_common*",
  "bdo_codec*",
  "bdo_export*",
  "bdo_midi*",
  "bdo_music_composer*",
  "optimization*",
]
