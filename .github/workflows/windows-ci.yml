name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12.10 regression suite
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            constraints-windows-py312.txt
            requirements-pyside.txt
            requirements-transcription.txt

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install pinned runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\install_transcription.ps1

      - name: Compile primary entry points
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m py_compile main.py project_paths.py pyside_bdo_gui.py i18n.py

      - name: Run headless lifecycle gate
        shell: pwsh
        run: |
          $env:BDO_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "bdo-music-composer-lifecycle"
          New-Item -ItemType Directory -Force -Path $env:BDO_USER_DATA_DIR | Out-Null
          .\.venv\Scripts\python.exe -m unittest -v tests.test_home_page.HomePageTests.test_window_starts_on_home_with_three_collections

      - name: Run full regression suite
        shell: pwsh
        run: |
          $env:BDO_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "bdo-music-composer-ci"
          New-Item -ItemType Directory -Force -Path $env:BDO_USER_DATA_DIR | Out-Null
          .\.venv\Scripts\python.exe -m unittest discover -s tests -t . -q
