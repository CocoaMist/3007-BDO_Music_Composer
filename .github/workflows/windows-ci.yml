name: Windows CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12.10 regression suite
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements/windows-py312.txt
            requirements/desktop.txt
            requirements/transcription.txt

      - name: Check repository hygiene
        shell: pwsh
        run: python tools\check_repository_hygiene.py

      - name: Create virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Install pinned runtime
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\install_transcription.ps1

      - name: Compile primary entry points
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m py_compile main.py src\bdo_music_composer\core\project_paths.py src\bdo_music_composer\ui\main_window.py src\bdo_music_composer\ui\i18n.py
          .\.venv\Scripts\python.exe -m compileall -q src

      - name: Run headless lifecycle gate
        shell: pwsh
        run: |
          $env:BDO_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "bdo-music-composer-lifecycle"
          New-Item -ItemType Directory -Force -Path $env:BDO_USER_DATA_DIR | Out-Null
          .\.venv\Scripts\python.exe -m unittest -v tests.test_home_page.HomePageTests.test_window_starts_on_home_with_three_collections

      - name: Run full regression suite
        shell: pwsh
        run: |
          $env:BDO_USER_DATA_DIR = Join-Path $env:RUNNER_TEMP "bdo-music-composer-ci"
          New-Item -ItemType Directory -Force -Path $env:BDO_USER_DATA_DIR | Out-Null
          .\.venv\Scripts\python.exe -m unittest discover -s tests -t . -q

      - name: Build and test native differential core
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\native_audio\build.ps1
          .\.venv\Scripts\python.exe -m unittest tests.test_native_audio_core tests.test_native_audio_parity -v
          powershell -ExecutionPolicy Bypass -File packaging\native_audio\build.ps1 -Configuration Debug -AddressSanitizer
