name: Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  candidate:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements/windows-py312.txt
      - name: Install pinned build runtime
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --constraint requirements\windows-py312.txt -r requirements\build.txt
          powershell -ExecutionPolicy Bypass -File scripts\install_transcription.ps1
      - name: Verify candidate before signing
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe tools\check_repository_hygiene.py
          .\.venv\Scripts\python.exe -m unittest discover -s tests -t . -q
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1
      - name: Attest unsigned candidate provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/BDO-Music-Composer.exe
      - name: Upload candidate and SPDX evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-windows-release-candidate
          path: |
            dist/BDO-Music-Composer.exe
            dist/release-evidence/*
          if-no-files-found: error

# Public publication remains a separate maintainer operation: import the
# Authenticode certificate into a protected signing environment, rerun
# packaging/windows/build.ps1 -PublicRelease -SigningCertificateThumbprint,
# verify the signed hash, then generate the RSA-signed update manifest.
